name: DuelPlugin
version: '${project.version}'
main: fr.duelplugin.DuelPlugin
api-version: '1.21'
description: Plugin de duel PvP pour Fedora Club
authors: [DuelPlugin]

commands:
  duel:
    description: Défier un joueur en duel
    usage: /duel <joueur>
    aliases: [duels, fight]
  acceptduel:
    description: Accepter un duel
    usage: /acceptduel [joueur]
  denyduel:
    description: Refuser un duel
    usage: /denyduel [joueur]
  da:
    description: Administration Fedora Club
    usage: /da <args>
    aliases: [dueladmin]
    permission: duelplugin.admin
  spec:
    description: Spectater un duel
    usage: /spec <joueur>
    aliases: [spectate, spect]
  vip:
    description: Commande VIP Fedora Club
    usage: /vip <args>
    aliases: [vipcolor]
  f:
    description: Commande Amis
    usage: /f <add|remove|list>
    aliases: [ami, friends]
  party:
    description: Commande Party
    usage: /party <create|invite|join|leave|kick|disband|list>
    aliases: [p, groupe]
  leave:
    description: Quitter un duel
    usage: /leave
    aliases: [quitter]
  settings:
    description: Paramètres du joueur
    usage: /settings [friends|duels]
    aliases: [parametres, options]
  ban:
    description: Bannir un joueur
    usage: /ban <joueur> [durée] [raison]
    permission: duelplugin.admin
  kick:
    description: Expulser un joueur
    usage: /kick <joueur> [raison]
    permission: duelplugin.admin
  tempban:
    description: Bannir temporairement un joueur
    usage: /tempban <joueur> <durée> [raison]
    permission: duelplugin.admin
  mute:
    description: Mute un joueur
    usage: /mute <joueur> <durée> [raison]
    permission: duelplugin.admin
  unban:
    description: Débannir un joueur
    usage: /unban <joueur>
    permission: duelplugin.admin
  unmute:
    description: Unmute un joueur
    usage: /unmute <joueur>
    permission: duelplugin.admin

permissions:
  duelplugin.admin:
    description: Permission admin du plugin
    default: op
  duelplugin.play:
    description: Permission de jouer
    default: true
  duelplugin.vip:
    description: Permission VIP
    default: op
