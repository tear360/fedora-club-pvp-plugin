name: DuelPlugin
version: '${project.version}'
main: fr.duelplugin.DuelPlugin
api-version: '1.21'
description: Duel PvP Practice plugin
authors: [DuelPlugin]
softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot

commands:
  duel:
    description: Challenge a player to a duel
    usage: /duel <player>
    aliases: [duels, fight]
  acceptduel:
    description: Accept a duel
    usage: /acceptduel [player]
  denyduel:
    description: Decline a duel
    usage: /denyduel [player]
  da:
    description: Duel plugin administration
    usage: /da <args>
    aliases: [dueladmin]
  spec:
    description: Spectate a duel
    usage: /spec <player>
    aliases: [spectate, spect]
  vip:
    description: VIP command
    usage: /vip <args>
    aliases: [vipcolor]
  f:
    description: Friends command
    usage: /f <add|remove|list>
    aliases: [friends]
  party:
    description: Party command
    usage: /party <create|invite|join|leave|kick|disband|list>
    aliases: [p]
  leave:
    description: Leave a duel
    usage: /leave
  settings:
    description: Player settings
    usage: /settings [friends|duels]
    aliases: [options]
  ban:
    description: Ban a player
    usage: /ban <player> [duration] [reason]
    permission: duelplugin.admin.ban
  kick:
    description: Kick a player
    usage: /kick <player> [reason]
    permission: duelplugin.admin.kick
  tempban:
    description: Temporarily ban a player
    usage: /tempban <player> <duration> [reason]
    permission: duelplugin.admin.tempban
  mute:
    description: Mute a player
    usage: /mute <player> <duration> [reason]
    permission: duelplugin.admin.mute
  unban:
    description: Unban a player
    usage: /unban <player>
    permission: duelplugin.admin.unban
  unmute:
    description: Unmute a player
    usage: /unmute <player>
    permission: duelplugin.admin.unmute
  report:
    description: Report a player
    usage: /report <player> <reason>
  bugreport:
    description: Report a bug
    usage: /bugreport <bug>

permissions:
  duelplugin.admin:
    description: Full admin permission (access to everything)
    default: op
    children:
      duelplugin.admin.reload: true
      duelplugin.admin.setlobby: true
      duelplugin.admin.arena: true
      duelplugin.admin.lobby: true
      duelplugin.admin.lobby.build: true
      duelplugin.admin.report: true
      duelplugin.admin.ban: true
      duelplugin.admin.kick: true
      duelplugin.admin.tempban: true
      duelplugin.admin.mute: true
      duelplugin.admin.unban: true
      duelplugin.admin.unmute: true
      duelplugin.admin.vip: true
      duelplugin.admin.rank: true
  duelplugin.admin.reload:
    description: Reload the configuration
    default: op
  duelplugin.admin.setlobby:
    description: Set the lobby spawn
    default: op
  duelplugin.admin.arena:
    description: Manage arenas
    default: op
  duelplugin.admin.lobby:
    description: Manage the lobby
    default: op
  duelplugin.admin.lobby.build:
    description: Build mode in the lobby
    default: op
  duelplugin.admin.report:
    description: Manage reports
    default: op
  duelplugin.admin.ban:
    description: Ban players
    default: op
  duelplugin.admin.kick:
    description: Kick players
    default: op
  duelplugin.admin.tempban:
    description: Temporarily ban players
    default: op
  duelplugin.admin.mute:
    description: Mute players
    default: op
  duelplugin.admin.unban:
    description: Unban players
    default: op
  duelplugin.admin.unmute:
    description: Unmute players
    default: op
  duelplugin.admin.vip:
    description: Manage VIP (set/remove)
    default: op
  duelplugin.admin.rank:
    description: Manage ranks (ADMIN/MANAGER/MODERATOR/VIP)
    default: op
  duelplugin.play:
    description: Permission to play
    default: true
  duelplugin.vip:
    description: VIP permission
    default: op
  duelplugin.acceptduel:
    description: Allow accepting duel requests
    default: op
  duelplugin.bugreport.bypass:
    description: Remove the /bugreport cooldown
    default: op